
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow faqat kodni o'qiy oladi.
permissions:
  contents: read

# Bir branch uchun yangi workflow boshlansa, eskisi bekor qilinadi.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      # 1. GitHub repository kodlarini yuklab olish
      - name: Checkout
        uses: actions/checkout@v4

      # 2. PHP va kerakli extensionlarni o'rnatish
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, gd, pdo_pgsql
          tools: composer:v2
          coverage: none

      # 3. Composer cache manzilini aniqlash
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # 4. Composer paketlarini cache qilish
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 5. PHP dependencylarni o'rnatish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # 6. Test uchun Laravel muhitini tayyorlash
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 7. Node.js 22 o'rnatish
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 8. Frontend paketlari va production build
      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      # 9. PHP kod formatini tekshirish
      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      # 10. PHPUnit testlarini bajarish
      - name: Run tests
        run: php artisan test
